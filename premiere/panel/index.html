<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    /* Native Premiere look: Spectrum controls on the host theme. Text is plain HTML with explicit sizes and colours:
       sp-body / sp-detail / sp-field-label render too large or too dim, and --uxp-host-text-color is unset in
       Premiere 26 (plain text came out black on the dark panel). */
    :root { --text: #d8d8d8; --text-muted: #a0a0a0; --rule: #3a3a3a; --hover: rgba(255, 255, 255, 0.08); }
    @media (prefers-color-scheme: light), (prefers-color-scheme: lightest) {
      :root { --text: #1f1f1f; --text-muted: #5c5c5c; --rule: #c8c8c8; --hover: rgba(0, 0, 0, 0.07); }
    }
    /* The page fills the panel and only the results list scrolls, so long result lists stay inside the panel. */
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: 10px 12px 0;
      color: var(--text);
      font-size: 12px;
      line-height: 16px;
    }
    body > * { flex-shrink: 0; }
    .muted { color: var(--text-muted); }
    .field { display: flex; flex-direction: row; align-items: center; height: 28px; }
    .field > .label { width: 76px; flex-shrink: 0; }
    .field > .control { flex: 1; }
    #hex { width: 84px; margin-left: 8px; }
    #targetSwatch { width: 14px; height: 14px; margin-right: 8px; border-radius: 3px; flex-shrink: 0; border: 1px solid var(--rule); }
    #targetSwatch.any { background-image: linear-gradient(135deg, #00ff00 0%, #00ff00 33%, #ff00ff 33%, #ff00ff 66%, #0000ff 66%); }
    #targetSwatch.unset { background-color: transparent; border-style: dashed; border-color: var(--text-muted); }
    #sensitivityValue { width: 28px; text-align: right; flex-shrink: 0; }
    .check { height: 24px; display: flex; align-items: center; }
    .actions { display: flex; flex-direction: row; align-items: center; margin: 10px 0; }
    .actions sp-button { margin-right: 8px; }
    #progressRow { margin-bottom: 10px; }
    #progress { width: 100%; }
    #progressLabel { margin-top: 2px; }
    .rule { height: 1px; background-color: var(--rule); margin: 2px 0 8px; }
    .heading { display: flex; flex-direction: row; justify-content: space-between; align-items: center; height: 20px; margin-bottom: 4px; }
    .heading .title { font-size: 11px; font-weight: bold; letter-spacing: 0.5px; }
    .heading #summary { font-size: 11px; }
    #status { padding: 4px 0; }
    #results { flex-grow: 1; flex-shrink: 1; flex-basis: 0; min-height: 0; overflow-y: auto; padding-bottom: 10px; }
    /* Columns: swatch | edge (takes the slack) | size | start | length, shared by the header and the rows. */
    .row { display: flex; flex-direction: row; align-items: center; padding: 0 6px; }
    .row > .edge { flex-grow: 1; flex-shrink: 1; flex-basis: 0; min-width: 0; overflow: hidden; white-space: nowrap; }
    .row > .size { width: 40px; text-align: right; flex-shrink: 0; }
    .row > .tc { width: 92px; text-align: right; flex-shrink: 0; font-family: monospace; font-size: 11px; }
    .row > .frames { width: 44px; text-align: right; flex-shrink: 0; }
    .row > .dismiss { width: 18px; text-align: center; flex-shrink: 0; margin-left: 2px; border-radius: 3px; }
    .row > .dismiss:hover { color: var(--text); background-color: var(--hover); }
    .columns > .dismiss:hover { background-color: transparent; }
    .columns { height: 18px; font-size: 10px; letter-spacing: 0.4px; border-bottom: 1px solid var(--rule); margin-bottom: 2px; }
    .columns > .tc { font-family: inherit; font-size: 10px; }
    .columns > .spacer { width: 10px; margin-right: 8px; flex-shrink: 0; }
    .result { height: 24px; border-radius: 3px; }
    .result:hover, .result.selected { background-color: var(--hover); }
    .swatch { width: 10px; height: 10px; margin-right: 8px; border-radius: 2px; flex-shrink: 0; }
    .swatch.off { width: 8px; height: 8px; border: 1px dashed var(--text-muted); }
    .result .tag { font-size: 10px; margin-left: 6px; }
    .more { padding: 6px; }
    .hidden { display: none; }
    .update { display: flex; flex-direction: row; align-items: center; padding: 6px 8px; margin-bottom: 8px; border-radius: 4px; background-color: var(--hover); }
    .update-text { flex: 1; margin-right: 8px; }
    .update.hidden { display: none; }
    .versions { font-size: 10px; padding-top: 8px; }
    #log { display: none; }
  </style>
</head>
<body>
  <div id="update" class="update hidden">
    <div id="updateText" class="update-text"></div>
    <sp-button id="updateButton" size="s" variant="accent">Update</sp-button>
  </div>
  <div class="field">
    <div class="label muted">Colour</div>
    <div id="targetSwatch"></div>
    <sp-picker id="target" class="control" size="s">
      <sp-menu slot="options">
        <sp-menu-item value="#00FF00">Green</sp-menu-item>
        <sp-menu-item value="#0000FF">Blue</sp-menu-item>
        <sp-menu-item value="#FF00FF">Magenta</sp-menu-item>
        <sp-menu-item value="#000000">Black</sp-menu-item>
        <sp-menu-item value="#FFFFFF">White</sp-menu-item>
        <sp-menu-divider></sp-menu-divider>
        <sp-menu-item value="any">Any colour</sp-menu-item>
        <sp-menu-item value="custom">Custom…</sp-menu-item>
      </sp-menu>
    </sp-picker>
    <sp-textfield id="hex" size="s" placeholder="#RRGGBB" class="hidden"></sp-textfield>
  </div>
  <div class="field">
    <div class="label muted">Sensitivity</div>
    <sp-slider id="sensitivity" class="control" min="0" max="100" step="5" value="50"></sp-slider>
    <div id="sensitivityValue" class="muted">50</div>
  </div>
  <div class="check"><sp-checkbox id="splits" size="s">Split-screen seams</sp-checkbox></div>
  <div class="check"><sp-checkbox id="useInOut" size="s" checked>In/Out only</sp-checkbox></div>

  <div class="actions">
    <sp-button id="scan" variant="cta" size="s">Scan</sp-button>
    <sp-action-button id="clear" size="s" quiet>Clear Markers</sp-action-button>
    <sp-action-button id="restore" size="s" quiet class="hidden" title="Bring back the findings hidden as Not a Line">Restore</sp-action-button>
  </div>
  <div id="progressRow" class="hidden">
    <sp-progressbar id="progress" size="s" max="100" value="0"></sp-progressbar>
    <div id="progressLabel" class="muted">Scanning</div>
  </div>

  <div class="rule"></div>
  <div class="heading">
    <div class="title muted">RESULTS</div>
    <div id="summary" class="muted"></div>
  </div>
  <div id="status" class="muted">Set In/Out on the sequence and press Scan.</div>
  <div id="columns" class="row columns muted hidden">
    <div class="spacer"></div><div class="edge">EDGE</div><div class="size">SIZE</div><div class="tc">START</div><div class="frames">LENGTH</div><div class="dismiss"></div>
  </div>
  <div id="results"></div>
  <div id="versions" class="muted versions"></div>
  <div id="log"></div>
  <script src="index.js"></script>
</body>
</html>
