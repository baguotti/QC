<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { padding: 10px 12px; font-size: 12px; color: var(--uxp-host-text-color); }
    .row { display: flex; align-items: center; margin-bottom: 6px; }
    .row > label { width: 76px; flex-shrink: 0; }
    #hex { width: 90px; margin-left: 6px; }
    #sensitivity { flex: 1; }
    .buttons { display: flex; margin: 8px 0; }
    .buttons sp-button { margin-right: 6px; }
    #progress { width: 100%; margin-bottom: 4px; }
    #status { min-height: 16px; margin-bottom: 6px; }
    #results { border-top: 1px solid rgba(128, 128, 128, 0.35); }
    .result { padding: 5px 2px; border-bottom: 1px solid rgba(128, 128, 128, 0.2); cursor: pointer; }
    .result:hover { background-color: rgba(128, 128, 128, 0.18); }
    .result .what { font-weight: bold; }
    .result.off .what { color: #e0a040; }
    .result .when { opacity: 0.75; font-family: monospace; font-size: 11px; }
    .swatch { display: inline-block; width: 9px; height: 9px; margin-right: 5px; border: 1px solid rgba(128, 128, 128, 0.6); }
    #log { margin-top: 10px; white-space: pre-wrap; font-family: monospace; font-size: 10px; opacity: 0.7; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="row">
    <label>Colour</label>
    <sp-picker id="target" size="s">
      <sp-menu slot="options">
        <sp-menu-item value="#00FF00">Green</sp-menu-item>
        <sp-menu-item value="#0000FF">Blue</sp-menu-item>
        <sp-menu-item value="#FF00FF">Magenta</sp-menu-item>
        <sp-menu-item value="#000000">Black</sp-menu-item>
        <sp-menu-item value="#FFFFFF">White</sp-menu-item>
        <sp-menu-item value="any">Any colour</sp-menu-item>
        <sp-menu-item value="custom">Custom…</sp-menu-item>
      </sp-menu>
    </sp-picker>
    <sp-textfield id="hex" size="s" placeholder="#RRGGBB" class="hidden"></sp-textfield>
  </div>
  <div class="row">
    <label>Sensitivity</label>
    <sp-slider id="sensitivity" min="0" max="100" step="5" value="50"></sp-slider>
  </div>
  <sp-checkbox id="splits">Split-screen seams</sp-checkbox>
  <sp-checkbox id="useInOut" checked>In/Out only</sp-checkbox>
  <div class="buttons">
    <sp-button id="scan" variant="cta">Scan</sp-button>
    <sp-button id="clear" variant="secondary" quiet>Clear markers</sp-button>
  </div>
  <sp-progressbar id="progress" max="100" value="0" class="hidden"></sp-progressbar>
  <div id="status"></div>
  <div id="results"></div>
  <div id="log"></div>
  <script src="index.js"></script>
</body>
</html>
